[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jgo"
version = "3.3.1.dev0"
description = "Launch Java code from Python and the CLI, installation-free."
license = "Unlicense"
authors = [{name = "Appose developers", email = "ctrueden@wisc.edu"}]
readme = "README.md"
keywords = ["java", "maven", "launch"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Java Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Shells",
    "Topic :: System :: System Shells",
    "Topic :: Utilities",
]

requires-python = ">=3.10"
dependencies = [
  "cjdk>=0.4.0",
  "psutil>=7",
  "requests>=2.30.0",
  "semver>=3.0.0",
  "tomli>=2.0.0; python_version<'3.11'",
  "tomli-w>=1.0.0",
]

[project.optional-dependencies]
cli = [
  "rich>=14.3.0",
  "rich-click>=1.9.5",
]

[dependency-groups]
cli = [
    "rich>=14.3.0",
    "rich-click>=1.9.5",
]
dev = [
    "build>=1.2.2",
    "griffe>=2.0.2",
    "mypy>=1.20.2",
    "pytest-prysk>=0.4.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "types-Pygments>=2.20.0",
    "types-colorama>=0.4.15",
    "types-psutil>=7.2.2",
    "types-requests>=2.33.0",
    "validate-pyproject[all]>=0.25",
    {include-group = "cli"},
]

[project.scripts]
jgo = "jgo.__main__:main"

[project.urls]
homepage = "https://github.com/apposed/jgo"
documentation = "https://jgo.apposed.org/"
source = "https://github.com/apposed/jgo"
download = "https://pypi.org/project/jgo/"
tracker = "https://github.com/apposed/jgo/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
jgo = ["py.typed"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]
extend-exclude = ["bin", "build", "dist"]

[tool.ruff.lint]
extend-select = ["TC", "UP037"]
extend-ignore = [
    "E203",
    # Broad `except Exception` is deliberate: CLI commands and best-effort
    # probes (JAR scanning, metadata lookups) must degrade gracefully rather
    # than crash on any single failure. Such handlers always log the cause.
    "BLE001",
    # jgo reports invalid user input (jgo.toml, coordinates, CLI arguments) as
    # ValueError regardless of whether the value or its type is wrong; callers
    # throughout the codebase catch ValueError to render friendly messages.
    "TRY004",
]

[tool.ruff.lint.per-file-ignores]
# Ignore `E402` (import violations) in all `__init__.py` files, and in `path/to/file.py`.
# Ignore `RUF022` too: the `__all__` lists are grouped by source module, not sorted.
"__init__.py" = ["E402", "F401", "RUF022"]

[tool.uv]
# prysk>=0.15 declares rich<14, but rich 14 is compatible with prysk's usage.
override-dependencies = ["rich>=14.3.0"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
    # jgo itself must not use its own deprecated packaging aliases.
    "error:.*'packaging' is deprecated:DeprecationWarning:jgo",
]
